<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Test - Caper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span class="sidebar-brand-name">Caper</span>
                <span class="sidebar-brand-dot"></span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="sidebar-link">Home</a>
            <a href="/tests" class="sidebar-link">Tests</a>
            <a href="/executions" class="sidebar-link">Executions</a>
            <a href="/health" class="sidebar-link">Health</a>
            <a href="/performance" class="sidebar-link">Performance</a>
            <a href="/tags" class="sidebar-link">Tags</a>
            <a href="/suites" class="sidebar-link">Suites</a>
            <a href="/suite-executions" class="sidebar-link">Suite Runs</a>
            <div class="sidebar-divider"></div>
            <a href="/create" class="sidebar-link active">Create Test</a>
            <a href="/variables" class="sidebar-link">Variables</a>
            <a href="/logs" class="sidebar-link">Log</a>
        </nav>
        <div class="sidebar-footer">
            {% if current_user.is_authenticated %}
            <span class="sidebar-user">{{ current_user.username }}</span>
            {% endif %}
            <a href="/logout" class="sidebar-link sidebar-link-danger">Sign out</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="test-builder" style="max-width:800px">
            <h2>Create New Test</h2>

            <div class="test-info">
                <div class="form-group">
                    <label for="testName">Test Name *</label>
                    <input type="text" id="testName" placeholder="e.g., Login Test" required>
                </div>
                <div class="form-group">
                    <label for="testDescription">Description</label>
                    <textarea id="testDescription" placeholder="Describe what this test does..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Browser</label>
                    <div style="display:flex;gap:1.2rem;align-items:center;margin-top:4px">
                        <label class="ed-method-opt">
                            <input type="radio" name="browserChoice" value="firefox" checked>
                            <span>Firefox</span>
                        </label>
                        <label class="ed-method-opt">
                            <input type="radio" name="browserChoice" value="chrome">
                            <span>Chrome</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="steps-section">
                <h3>Test Steps</h3>
                <div id="stepsList"></div>

                <div class="add-step-section">
                    <h4>Add Step</h4>
                    <div class="form-group">
                        <label for="actionType">Action Type *</label>
                        <select id="actionType">
                            <option value="navigate">Navigate to URL</option>
                            <option value="click">Click Element</option>
                            <option value="type">Type Text</option>
                            <option value="wait">Wait</option>
                            <option value="execute_js">Execute JavaScript</option>
                            <option value="screenshot">Take Screenshot</option>
                            <option value="assert_title">Assert Title</option>
                            <option value="assert_text">Assert Element Text</option>
                            <option value="assert_visible">Assert Element Visible</option>
                            <option value="assert_hidden">Assert Element Hidden</option>
                            <option value="assert_url">Assert URL</option>
                            <option value="assert_value">Assert Input Value</option>
                            <option value="scroll_to">Scroll To Element</option>
                            <option value="select">Select Dropdown Option</option>
                            <option value="key_press">Key Press</option>
                            <option value="hover">Hover</option>
                            <option value="double_click">Double Click</option>
                            <option value="right_click">Right Click</option>
                            <option value="check">Check (checkbox/radio)</option>
                            <option value="uncheck">Uncheck (checkbox/radio)</option>
                            <option value="drag_and_drop">Drag and Drop</option>
                            <option value="upload_file">Upload File</option>
                            <option value="wait_for_element">Wait For Element</option>
                            <option value="wait_for_load_state">Wait For Load State</option>
                            <option value="clear">Clear Input</option>
                            <option value="pick_random">Pick Random Element</option>
                        </select>
                    </div>
                    <div id="stepConfig"></div>
                    <button class="btn btn-primary" onclick="addStep()">Add Step</button>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-success btn-lg" onclick="saveTest()">Save Test</button>
                <button class="btn btn-secondary" onclick="resetTest()">Reset</button>
            </div>
        </div>

        <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    </main>
</div>
</body>
</html>
