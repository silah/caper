<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Test - Caper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span class="sidebar-brand-name">Caper</span>
                <span class="sidebar-brand-dot"></span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="sidebar-link">Home</a>
            <a href="/tests" class="sidebar-link">Tests</a>
            <a href="/executions" class="sidebar-link">Executions</a>
            <a href="/health" class="sidebar-link">Health</a>
            <a href="/performance" class="sidebar-link">Performance</a>
            <a href="/tags" class="sidebar-link">Tags</a>
            <a href="/suites" class="sidebar-link">Suites</a>
            <a href="/suite-executions" class="sidebar-link">Suite Runs</a>
            <div class="sidebar-divider"></div>
            <a href="/create" class="sidebar-link active">Create Test</a>
            <a href="/variables" class="sidebar-link">Variables</a>
            <a href="/logs" class="sidebar-link">Log</a>
            <a href="/docs" class="sidebar-link">Docs</a>
        </nav>
        <div class="sidebar-footer">
            {% if current_user.is_authenticated %}
            <span class="sidebar-user">{{ current_user.username }}</span>
            {% endif %}
            <a href="/logout" class="sidebar-link sidebar-link-danger">Sign out</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="test-builder" style="max-width:800px">
            <h2>Create New Test</h2>

            <div class="test-info">
                <div class="form-group">
                    <label for="testName">Test Name *</label>
                    <input type="text" id="testName" placeholder="e.g., Login Test" required>
                </div>
                <div class="form-group">
                    <label for="testDescription">Description</label>
                    <textarea id="testDescription" placeholder="Describe what this test does..." rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Browser</label>
                    <div style="display:flex;gap:1.2rem;align-items:center;margin-top:4px">
                        <label class="ed-method-opt">
                            <input type="radio" name="browserChoice" value="firefox" checked>
                            <span>Firefox</span>
                        </label>
                        <label class="ed-method-opt">
                            <input type="radio" name="browserChoice" value="chrome">
                            <span>Chrome</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="steps-section">
                <h3>Test Steps</h3>
                <div id="stepsList"></div>

                <div class="add-step-section">
                    <h4>Add Step</h4>
                    <div class="form-group step-type-row">
                        <div>
                            <label for="stepCategory">Category</label>
                            <select id="stepCategory">
                                <option value="Navigation">Navigation</option>
                                <option value="Interactions">Interactions</option>
                                <option value="Assertions">Assertions</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Conditionals">Conditionals</option>
                            </select>
                        </div>
                        <div>
                            <label for="actionType">Step Type</label>
                            <select id="actionType"></select>
                        </div>
                    </div>
                    <div id="stepConfig"></div>
                    <button class="btn btn-primary" onclick="addStep()">Add Step</button>
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-success btn-lg" onclick="saveTest()">Save Test</button>
                <button class="btn btn-secondary" onclick="resetTest()">Reset</button>
            </div>
        </div>

        <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    </main>
</div>
</body>
</html>
